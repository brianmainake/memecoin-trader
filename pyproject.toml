[project]
name = "memecoin-trader"
version = "0.0.1"
description = "Personal Solana memecoin tracker and (eventually) trader"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/api",
    "services/ingestor",
    "packages/shared",
    "packages/decoder",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "packages"]

[project]
name = "api"
version = "0.0.1"
description = "REST + WebSocket API for memecoin-trader"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
api = "api.__main__:entrypoint"

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[project]
name = "alerts"
version = "0.0.1"
description = "Alert engine — LISTEN trade_events, evaluate rules, deliver"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "asyncpg>=0.29",
]

[project.scripts]
alerts = "alerts.__main__:entrypoint"

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts"]

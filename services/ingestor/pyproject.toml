[project]
name = "ingestor"
version = "0.0.1"
description = "Solana stream ingestor for memecoin-trader"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "decoder",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "websockets>=13",
]

[project.scripts]
ingestor = "ingestor.__main__:entrypoint"

[tool.uv.sources]
shared = { workspace = true }
decoder = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]
